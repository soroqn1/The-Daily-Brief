output_dir: ~/.the-daily-brief        # internal logs & state
storage_dir: ~/Desktop/TheDailyBrief   # where generated .md & .html reports are saved
brief_language: en

llm:
  provider: gemini                 # gemini | openai
  model: gemini-flash-lite-latest

spaces:
  default:
    gmail_token_env: GMAIL_REFRESH_TOKEN
    gmail_scan_hours: 12
    gmail_audit_days: 5
    obsidian_enabled: true
  work:
    gmail_token_env: GMAIL_REFRESH_TOKEN_WORK
    gmail_scan_hours: 12
    gmail_audit_days: 5
    obsidian_enabled: false
  study:
    gmail_token_env: GMAIL_REFRESH_TOKEN_STUDY
    gmail_scan_hours: 12
    gmail_audit_days: 5
    obsidian_enabled: false

connectors:
  gmail:
    enabled: true
    max_emails: 20

  obsidian:
    enabled: true
    vault_path: ~/me/obsidian
    scan_dirs: ["50 Daily", "10 Projects"]

  calendar:
    enabled: false                 # phase 2
