<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f4eedf" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Outer Newsprint Hairline Borders -->
  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#232428" stroke-width="1.2" />
  <line x1="24" y1="64" x2="1176" y2="64" stroke="#232428" stroke-width="1" />
  <line x1="24" y1="356" x2="1176" y2="356" stroke="#232428" stroke-width="1" />

  <!-- Folio Header Strip -->
  <text x="44" y="49" fill="#8a877e" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">VOL. I · NO. 24 · LOCAL INTELLIGENCE BROADSHEET</text>
  <text x="1156" y="49" text-anchor="end" fill="#c99738" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">LOCAL-FIRST · 100% PRIVATE · RUNS ANYWHERE</text>

  <!-- Left Column: Editorial Masthead & Overview -->
  <g transform="translate(56, 92)">
    <!-- Crest Icon Box -->
    <rect x="0" y="0" width="44" height="44" fill="#18191d" stroke="#32333a" stroke-width="1.2" />
    <path d="M10 11h24M10 22h24M10 33h13M22 11v22" stroke="#eac775" stroke-width="2" stroke-linecap="square" />
    <circle cx="30" cy="33" r="2" fill="#eac775" />

    <!-- Newspaper Title & Kicker -->
    <text x="58" y="16" fill="#c99738" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="800" letter-spacing="2">MORNING INTELLIGENCE DISPATCH</text>
    <text x="58" y="46" fill="#ffffff" font-family="Georgia, serif" font-size="38" font-weight="900" letter-spacing="-0.5">The Daily Brief</text>

    <!-- Motto -->
    <text x="0" y="88" fill="#c8c2b5" font-family="Georgia, serif" font-style="italic" font-size="15">
      &ldquo;All the signal fit to compute — synthesized every morning.&rdquo;
    </text>

    <!-- Value Proposition -->
    <text x="0" y="122" fill="#8e897e" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400">
      A local open-source orchestrator that polls your Gmail, Obsidian &amp; sources,
    </text>
    <text x="0" y="142" fill="#8e897e" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400">
      synthesizes priorities via LLM, and prints a bespoke newspaper front page.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 178)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="94" height="24" rx="2" fill="#191a1e" stroke="#2e3037" stroke-width="1" />
      <text x="47" y="16" text-anchor="middle" fill="#d2cdc3" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">PYTHON 3.12</text>

      <!-- Pill 2 -->
      <rect x="102" y="0" width="76" height="24" rx="2" fill="#191a1e" stroke="#2e3037" stroke-width="1" />
      <text x="140" y="16" text-anchor="middle" fill="#d2cdc3" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">FASTAPI</text>

      <!-- Pill 3 -->
      <rect x="186" y="0" width="68" height="24" rx="2" fill="#191a1e" stroke="#2e3037" stroke-width="1" />
      <text x="220" y="16" text-anchor="middle" fill="#d2cdc3" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">JINJA2</text>

      <!-- Pill 4 -->
      <rect x="262" y="0" width="100" height="24" rx="2" fill="#191a1e" stroke="#2e3037" stroke-width="1" />
      <text x="312" y="16" text-anchor="middle" fill="#d2cdc3" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">LOCAL-FIRST</text>

      <!-- Pill 5 -->
      <rect x="370" y="0" width="112" height="24" rx="2" fill="#191a1e" stroke="#3d382d" stroke-width="1" />
      <text x="426" y="16" text-anchor="middle" fill="#eac775" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">ZERO CLOUD</text>
    </g>

    <!-- Quick Run Prompt -->
    <g transform="translate(0, 218)">
      <text x="0" y="14" fill="#66635c" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">
        $ git clone ... &amp;&amp; uv sync &amp;&amp; task serve
      </text>
    </g>
  </g>

  <!-- Right Column: Broadsheet Newspaper Mockup Card -->
  <g transform="translate(640, 84)" filter="url(#cardShadow)">
    <!-- Paper Sheet Background -->
    <rect width="490" height="252" rx="2" fill="url(#paperGrad)" stroke="#dcd4c3" stroke-width="1.2" />

    <!-- Sheet Masthead Strip -->
    <rect x="14" y="12" width="462" height="26" fill="#ebe4d2" />
    <text x="24" y="29" fill="#1c1917" font-family="Georgia, serif" font-size="12" font-weight="900" letter-spacing="0.5">THE MORNING DISPATCH</text>
    <text x="466" y="29" text-anchor="end" fill="#57534e" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" font-weight="700">EDITION #241 · 08:30 AM</text>

    <line x1="14" y1="44" x2="476" y2="44" stroke="#1c1917" stroke-width="1.5" />
    <line x1="14" y1="47" x2="476" y2="47" stroke="#1c1917" stroke-width="0.5" />

    <!-- Stamp in Header (Placed safely in top right without overlapping text) -->
    <g transform="translate(390, 54) rotate(-4)">
      <rect width="78" height="20" fill="none" stroke="#15803d" stroke-width="1.5" rx="1" />
      <text x="39" y="14" text-anchor="middle" fill="#15803d" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" letter-spacing="1">DISPATCHED</text>
    </g>

    <!-- Lead Story -->
    <text x="18" y="64" fill="#b91c1c" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" letter-spacing="1">⚡ ACTION REQUIRED · GMAIL</text>
    <text x="18" y="80" fill="#1c1917" font-family="Georgia, serif" font-size="14" font-weight="700">Q3 Partnership Review &amp; Contract Sign-off</text>
    <text x="18" y="96" fill="#57534e" font-family="-apple-system, sans-serif" font-size="10">Legal forwarded revised agreement. Requires sign-off before 12:00 PM.</text>

    <!-- Horizontal Divider -->
    <line x1="14" y1="110" x2="476" y2="110" stroke="#dcd4c3" stroke-width="1" />

    <!-- Split Columns Grid -->
    <!-- Col 1: Overnight Missed -->
    <g transform="translate(18, 126)">
      <text x="0" y="0" fill="#1e3a8a" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" letter-spacing="0.8">📬 OVERNIGHT DISPATCH</text>
      <text x="0" y="16" fill="#1c1917" font-family="Georgia, serif" font-size="12" font-weight="700">3 Unread Messages</text>
      <text x="0" y="32" fill="#57534e" font-family="-apple-system, sans-serif" font-size="9.5">• Stripe payout cleared ($4,250)</text>
      <text x="0" y="47" fill="#57534e" font-family="-apple-system, sans-serif" font-size="9.5">• Bug report on token expiry</text>
    </g>

    <!-- Vertical Column Separator -->
    <line x1="240" y1="116" x2="240" y2="204" stroke="#dcd4c3" stroke-width="1" />

    <!-- Col 2: Obsidian Vault -->
    <g transform="translate(254, 126)">
      <text x="0" y="0" fill="#15803d" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" letter-spacing="0.8">📝 OBSIDIAN VAULT</text>
      <text x="0" y="16" fill="#1c1917" font-family="Georgia, serif" font-size="12" font-weight="700">Today's Focus: v0.2 Release</text>
      <text x="0" y="32" fill="#57534e" font-family="-apple-system, sans-serif" font-size="9.5">[ ] Review architecture draft</text>
      <text x="0" y="47" fill="#57534e" font-family="-apple-system, sans-serif" font-size="9.5">[ ] Ship PR #14 and deploy</text>
    </g>

    <!-- Paper Footer Strip -->
    <rect x="0" y="218" width="490" height="34" fill="#ebe4d2" />
    <circle cx="22" cy="235" r="3.5" fill="#16a34a" />
    <text x="32" y="238" fill="#44403c" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" font-weight="700">LOCAL HUB ACTIVE · HTTP://LOCALHOST:8000</text>
    <text x="474" y="238" text-anchor="end" fill="#78716c" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">GEN: 1.4s · 0 TELEMETRY</text>
  </g>

  <!-- Bottom Footer Status Bar -->
  <circle cx="48" cy="377" r="3.5" fill="#22c55e" />
  <text x="60" y="381" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="0.8">LOCAL-FIRST MORNING INTELLIGENCE · RUNS ON MACOS, LINUX &amp; WINDOWS</text>
  <text x="1156" y="381" text-anchor="end" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">GITHUB.COM/SOROQN1/THE-DAILY-BRIEF</text>
</svg>
