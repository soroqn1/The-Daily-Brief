version: '3'

tasks:
  ruff:
    desc: Run ruff linter and format check
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  format:
    desc: Format and auto-fix code with ruff
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  test:
    desc: Run test suite with pytest
    cmds:
      - uv run pytest

  pre-commit:
    desc: Run all pre-commit checks (ruff + tests)
    cmds:
      - task: ruff
      - task: test

  install-agent:
    desc: Install and load macOS launchd agent
    cmds:
      - mkdir -p ~/Library/LaunchAgents ~/.the-daily-brief/logs
      - cp trigger/com.dailybrief.plist ~/Library/LaunchAgents/com.dailybrief.plist
      - launchctl unload ~/Library/LaunchAgents/com.dailybrief.plist 2>/dev/null || true
      - launchctl load ~/Library/LaunchAgents/com.dailybrief.plist
      - echo "LaunchAgent loaded successfully."

  uninstall-agent:
    desc: Unload and remove macOS launchd agent
    cmds:
      - launchctl unload ~/Library/LaunchAgents/com.dailybrief.plist 2>/dev/null || true
      - rm -f ~/Library/LaunchAgents/com.dailybrief.plist
      - echo "LaunchAgent uninstalled."

