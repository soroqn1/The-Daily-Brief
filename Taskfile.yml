version: '3'

tasks:
  serve:
    desc: Run local FastAPI server on http://localhost:8000
    cmds:
      - uv run uvicorn the_daily_brief.server:app --port 8000 --reload

  brief-now:
    desc: Force generate and display today's daily brief immediately in browser
    cmds:
      - uv run python -m the_daily_brief.main daily --force {{.CLI_ARGS}}

  email-now:
    desc: Force generate and display today's email audit immediately in browser
    cmds:
      - uv run python -m the_daily_brief.main email --force {{.CLI_ARGS}}

  auth-gmail:
    desc: Authorize Gmail via browser and save refresh token to .env (pass --space <name>)
    cmds:
      - uv run python -m the_daily_brief.auth {{.CLI_ARGS}}

  ruff:
    desc: Run ruff linter and format check
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  format:
    desc: Format and auto-fix code with ruff
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  test:
    desc: Run test suite with pytest
    cmds:
      - uv run pytest

  pre-commit:
    desc: Run all pre-commit checks (ruff + tests)
    cmds:
      - task: ruff
      - task: test
